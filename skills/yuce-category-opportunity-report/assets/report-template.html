  <aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">研</div><div><b>类目机会研究</b><small>预策月度数据 · 一级至三级</small></div></div><nav class="nav" aria-label="报告目录">__NAV__</nav><div class="side-note">__SIDE_NOTE__</div></aside>
  <div class="app"><header class="topbar"><div class="tools"><button class="menu-toggle" id="menuToggle" aria-label="打开目录">☰</button><div class="identity"><b>__CATEGORY__</b><span>类目研究优先级报告</span></div></div><div class="tools"><input class="search" id="search" placeholder="搜索当前页" aria-label="搜索当前页"><div class="date-chip">__PERIOD__</div></div></header><div class="reading-path"><b>阅读顺序</b><span>先看判断 → 首批方向 → 选择方法 → 逐月与全量证据</span></div><main>__CONTENT__<div class="footer">__FOOTER__</div></main></div>
  <script>
    const views=[...document.querySelectorAll('[data-view]')],buttons=[...document.querySelectorAll('[data-view-target]')];
    const group=document.getElementById('candidateNavGroup'),submenu=document.getElementById('candidateSubmenu');
    let submenuOpened=false;
    const disclosure=document.getElementById('candidateToggle'),menuToggle=document.getElementById('menuToggle'),sidebar=document.getElementById('sidebar');
    function setSubmenu(open){submenuOpened=open;submenu.hidden=!open;group.classList.toggle('expanded',open);disclosure.setAttribute('aria-expanded',String(open));disclosure.setAttribute('aria-label',open?'收起研究路线目录':'展开研究路线目录')}
    disclosure.addEventListener('click',()=>setSubmenu(!submenuOpened));
    function syncMenu(){const visible=window.matchMedia('(max-width:760px)').matches?sidebar.classList.contains('open'):!document.body.classList.contains('sidebar-hidden');menuToggle.setAttribute('aria-expanded',String(visible));menuToggle.setAttribute('aria-controls','sidebar');menuToggle.setAttribute('aria-label',visible?'收起目录':'展开目录')}
    function showView(id,{writeHash=true}={}){const target=views.some(v=>v.dataset.view===id)?id:views[0].dataset.view;views.forEach(v=>{v.hidden=v.dataset.view!==target});buttons.forEach(b=>{const active=b.dataset.viewTarget===target;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});if(target==='candidates'||target.startsWith('candidate-'))setSubmenu(true);else if(submenuOpened)setSubmenu(false);if(writeHash&&location.hash.slice(1)!==target)history.pushState(null,'','#'+target);document.getElementById('sidebar').classList.remove('open');syncMenu();window.scrollTo(0,0)}
    buttons.forEach(b=>b.addEventListener('click',()=>showView(b.dataset.viewTarget)));window.addEventListener('popstate',()=>showView(location.hash.slice(1),{writeHash:false}));showView(location.hash.slice(1),{writeHash:false});
    menuToggle.addEventListener('click',()=>{if(window.matchMedia('(max-width:760px)').matches){document.body.classList.remove('sidebar-hidden');sidebar.classList.toggle('open')}else{document.body.classList.toggle('sidebar-hidden');sidebar.classList.remove('open')}syncMenu()});window.addEventListener('resize',syncMenu);document.addEventListener('keydown',event=>{if(event.key==='Escape'){sidebar.classList.remove('open');syncMenu()}});syncMenu();
    const allTable=document.getElementById('allCategoryTable'),allRows=[...allTable.tBodies[0].rows];
    const secondFilter=document.getElementById('allSecondFilter'),statusFilter=document.getElementById('allStatusFilter'),textFilter=document.getElementById('allTextFilter'),routeFilter=document.getElementById('allRouteFilter');
    function filterAll(){const global=document.getElementById('search').value.trim().toLowerCase(),local=textFilter.value.trim().toLowerCase();let count=0;allRows.forEach(row=>{const visible=(!secondFilter.value||row.dataset.second===secondFilter.value)&&(!statusFilter.value||row.dataset.status===statusFilter.value)&&(!routeFilter.value||row.dataset.route===routeFilter.value)&&(!local||row.textContent.toLowerCase().includes(local))&&(!global||row.textContent.toLowerCase().includes(global));row.hidden=!visible;if(visible)count++});document.getElementById('allTableCount').textContent=count+' / '+allRows.length+' 行';window.yuceCharts?.refresh()}
    [secondFilter,statusFilter,textFilter,routeFilter].forEach(input=>input.addEventListener('input',filterAll));
    let sortColumn=8,sortDirection=-1;
    function sortAll(column){const isText=[0,1,9,10,16].includes(column);sortDirection=column===sortColumn?-sortDirection:(isText||column===13?1:-1);sortColumn=column;allRows.sort((a,b)=>{const av=a.cells[column].dataset.sort,bv=b.cells[column].dataset.sort;if(av===''||bv==='')return av===''&&bv===''?0:av===''?1:-1;const result=isText?av.localeCompare(bv,'zh-CN'):Number(av)-Number(bv);return result*sortDirection});allRows.forEach(row=>allTable.tBodies[0].appendChild(row));allTable.querySelectorAll('th').forEach((th,index)=>{if(index===column)th.setAttribute('aria-sort',sortDirection===1?'ascending':'descending');else th.removeAttribute('aria-sort')});filterAll()}
    allTable.querySelectorAll('[data-sort-column]').forEach(button=>button.addEventListener('click',()=>sortAll(Number(button.dataset.sortColumn))));
    document.getElementById('search').addEventListener('input',e=>{const term=e.target.value.trim().toLowerCase();document.querySelectorAll('[data-view]:not([hidden]) .searchable').forEach(n=>n.hidden=!!term&&!n.textContent.toLowerCase().includes(term));filterAll()});
    window.yuceReport={contract:'yuce-category-opportunity@2.0',showView,visibleViews:()=>views.filter(v=>!v.hidden).map(v=>v.dataset.view),filterAll,sortAll};
  </script>
