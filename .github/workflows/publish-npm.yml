name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      release:
        description: patch, minor, major, prerelease, or exact semver
        required: true
        default: patch
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options: [latest, next]

      recover_existing:
        description: Recover publication of the exact already validated Git tag
        type: boolean
        default: false
      validated_run:
        description: Successful release run proving the unchanged package source
        type: string
        default: ''

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  qa:
    if: ${{ !inputs.recover_existing }}
    uses: ./.github/workflows/qa.yml
  publish:
    if: ${{ !inputs.recover_existing }}
    env:
      TAOBAO_AI_OPS_STATE_DIR: ${{ github.workspace }}/../taobao-ai-ops-publish-qa/state
      TAOBAO_AI_OPS_TEST_STATE_DIR: ${{ github.workspace }}/../taobao-ai-ops-publish-qa/state
      TAOBAO_AI_OPS_AUTO_UPDATE: '0'
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm for OIDC
        run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run check --if-present
      - run: node bin/taobao-ai-ops.mjs components install --target-dir .qa-skills --yes --json
      - run: npm test --if-present
      - run: npm run test:upgrade # scripts/test-upgrade-compat.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm run test:business
      - run: npm pack --dry-run --json
      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish @petercjl/taobao-ai-ops
        run: npx --yes --package @petercjl/npm-release-kit@0.1.4 npm-release-kit ci publish --release "${{ inputs.release }}" --tag "${{ inputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  recover:
    if: ${{ inputs.recover_existing }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - name: Recover exact validated publication through OIDC
        run: node scripts/recover-npm-publication.mjs --release "${{ inputs.release }}" --tag "${{ inputs.tag }}" --validated-run "${{ inputs.validated_run }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ''
